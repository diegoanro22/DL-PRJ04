# Kaggle: P100 o T4, 16 GB. No soportan bf16, así que se usa fp16 con GradScaler.
# Preferir "GPU T4 x2": las versiones recientes de PyTorch dejaron de compilar para la P100
# (Pascal, sm_60). Si sale "no kernel image is available", cambiar el acelerador a T4.
# Las rutas apuntan a los datasets montados en /kaggle/input.
machine: kaggle
device: cuda
precision: fp16
# Cisco: completar con la carpeta real de cada dataset en /kaggle/input al subirlos.
dataset_roots:
  asv19: /kaggle/input/asvpoof-2019-dataset/LA/LA
  asv21: /kaggle/input/asvspoof2021-la/ASVspoof2021_LA_eval
  mlaad_es: /kaggle/input/mlaad-es
  propios: /kaggle/input/voces-propias
output_root: /kaggle/working/runs
num_workers: 4

overrides:
  xlsr_aasist:
    batch_size: 8
    grad_accum: 2          # efectivo 16, igual que en la laptop
    gradient_checkpointing: true
