# Modelo A2: LFCC + LCNN con augmentation telefónica y RawBoost.
# Acelerado vs A1: warm-start (kernel), eval_every, aug p=0.5, menos épocas.
model: lfcc_cnn
seed: 42

audio:
  sample_rate: 16000
  num_samples: 64600

features:
  n_lfcc: 60
  win_ms: 20
  hop_ms: 10
  deltas: true

train:
  epochs: 20
  batch_size: 64
  grad_accum: 1
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine
  loss: weighted_ce
  early_stopping_metric: dev_eer
  patience: 4
  eval_every: 2          # ~mitad del coste de eval en dev

augment:
  telephony: true
  rawboost: true
  p: 0.5                 # cada aug con prob 0.5 (más rápido que siempre)
