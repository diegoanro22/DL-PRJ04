# Modelo A2: LFCC + LCNN con augmentation telefónica y RawBoost.
model: lfcc_cnn
seed: 42

audio:
  sample_rate: 16000
  num_samples: 64600

features:
  n_lfcc: 60
  win_ms: 20
  hop_ms: 10
  deltas: true

train:
  epochs: 30
  batch_size: 64
  grad_accum: 1
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine
  loss: weighted_ce
  early_stopping_metric: dev_eer
  patience: 5

augment:
  telephony: true
  rawboost: true
