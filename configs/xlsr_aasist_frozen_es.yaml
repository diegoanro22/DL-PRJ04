# Modelo C3: C2 + voz real en español (FLEURS) y sintetizadores modernos (Edge TTS, F5-TTS).
# C2 no detecta clonadores comerciales actuales (entrenó con ataques de ASVspoof 2019). Se parte
# de C2 y se reentrena solo la cabeza con ASVspoof 2019 + español (protocols/mix_train.csv), con
# lr menor para no olvidar lo aprendido. Entrenar con:
#   --train-split mix_train --dev-split mix_dev
model: xlsr_aasist
variant: xlsr_aasist_frozen  # para que no le apliquen los overrides de memoria de C1/C2
seed: 42
init_from: runs/C2/best.pt

audio:
  sample_rate: 16000
  num_samples: 64600

model_args:
  ssl_name: facebook/wav2vec2-xls-r-300m
  freeze_ssl: true
  gradient_checkpointing: false   # sin gradientes en XLS-R no hace falta
  normalize_input: true

train:
  epochs: 6
  batch_size: 16             # mismo batch efectivo que C1/C2, sin acumulación
  grad_accum: 1
  optimizer: adam
  lr_head: 5.0e-5            # la mitad que C2: la cabeza ya viene entrenada
  weight_decay: 1.0e-4
  scheduler: cosine
  loss: weighted_ce
  early_stopping_metric: dev_eer
  patience: 2

augment:
  telephony: 0.5            # probabilidad por audio
  rawboost: 0.5
